name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # Review iterations use targeted local tests; run the full matrix when
    # a PR is opened/ready, or explicitly for its final head.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Allelio with test extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python3 -m pytest -q
