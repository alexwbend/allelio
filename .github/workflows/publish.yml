name: Publish to PyPI

# Publishes the sdist and wheel when a release tag such as v0.4.1 is pushed.
# Data tags (v0.3.0-data and similar) do not match the pattern below.
# PyPI trusted publishing: no API token is stored in this repository. The
# pending publisher on pypi.org must name this workflow file and the "pypi"
# environment.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi
          if ! grep -q "^version: $version$" CITATION.cff; then
            echo "CITATION.cff does not describe version $version" >&2
            exit 1
          fi
          if grep -n "YYYY-MM-DD" CITATION.cff CHANGELOG.md; then
            echo "Set the release date in CITATION.cff and CHANGELOG.md before tagging" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build twine
          python3 -m build
          python3 -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/allelio/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
